<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3524">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bäume hassen dich – 100 Level</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #142619; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      touch-action: none; color: #f4f1e6;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 14px;
      background: rgba(14, 26, 18, 0.9); backdrop-filter: blur(4px); z-index: 20;
      overflow-y: auto;
    }
    .hidden { display: none !important; }
    .card {
      background: #233b29; border: 3px solid #4c7554; border-radius: 16px;
      padding: 16px 18px; width: 100%; max-width: 450px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
    }
    h1 { margin: 0 0 4px; font-size: 1.48rem; text-align: center; color: #f6e27f; letter-spacing: 0.4px; }
    .sub { text-align: center; font-size: 0.85rem; color: #c7d9c9; margin: 0 0 12px; }
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .field label { display: block; font-size: 0.76rem; color: #b7ceb9; margin-bottom: 3px; }
    .field select, .field input {
      width: 100%; padding: 7px 9px; border-radius: 8px; border: 2px solid #4c7554;
      background: #17291c; color: #f4f1e6; font-size: 0.88rem; font-weight: 600;
    }
    .level-box {
      background: #17291c; border: 2px solid #4c7554; border-radius: 10px;
      padding: 9px 11px; margin-bottom: 10px;
    }
    .level-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
    .level-row span { font-size: 0.84rem; font-weight: 700; color: #f6e27f; }
    .level-row small { font-size: 0.76rem; color: #b7ceb9; }
    .level-controls { display: flex; gap: 6px; align-items: center; }
    .mini-btn {
      padding: 6px 10px; border-radius: 8px; border: 2px solid #4c7554;
      background: #233b29; color: #f4f1e6; font-weight: 800; cursor: pointer; font-size: 0.85rem;
    }
    .mini-btn:active { background: #365c3e; }
    input[type="range"] { flex: 1; accent-color: #e09f3e; padding: 0; border: none; }

    .mode-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .mode-btn {
      flex: 1; padding: 8px; border-radius: 10px; border: 2px solid #4c7554;
      background: #17291c; color: #cde0cf; font-weight: 700; cursor: pointer; font-size: 0.84rem;
    }
    .mode-btn.active { background: #3f7d4a; border-color: #f6e27f; color: #fff; }
    .btn-primary {
      width: 100%; padding: 11px; border: none; border-radius: 12px;
      background: #e09f3e; color: #1a1a1a; font-size: 1.02rem; font-weight: 800;
      cursor: pointer; box-shadow: 0 4px 0 #9e6a1f;
    }
    .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #9e6a1f; }
    .btn-sec {
      width: 100%; padding: 9px; border: 2px solid #598562; border-radius: 10px;
      background: #1b3021; color: #f4f1e6; font-size: 0.92rem; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }
    .btn-trap {
      width: 100%; padding: 9px; border: 2px solid #b5543c; border-radius: 10px;
      background: #3d1f19; color: #ffd4c9; font-size: 0.92rem; font-weight: 700;
      cursor: pointer; margin-top: 8px;
    }
    .stats-bar {
      display: flex; justify-content: space-between; font-size: 0.78rem;
      color: #b7ceb9; margin-top: 10px; padding-top: 8px; border-top: 1px solid #38573f;
    }

    #hud {
      position: fixed; top: env(safe-area-inset-top, 10px); left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .hud-pill {
      background: rgba(18, 34, 23, 0.84); border: 2px solid #4c7554;
      border-radius: 10px; padding: 6px 10px; font-size: 0.8rem; font-weight: 700;
      line-height: 1.35; color: #f4f1e6;
    }
    .hud-sub { display: block; font-size: 0.72rem; color: #f6e27f; font-weight: 600; }
    .hud-actions { display: flex; gap: 8px; pointer-events: auto; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px; border: 2px solid #4c7554;
      background: rgba(18, 34, 23, 0.85); color: #f4f1e6; font-size: 1.2rem;
      font-weight: 800; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active { background: #365c3e; }

    #toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 34, 24, 0.94); border: 2px solid #f6e27f;
      color: #f6e27f; padding: 7px 15px; border-radius: 999px; font-size: 0.84rem;
      font-weight: 700; z-index: 15; pointer-events: none; opacity: 0;
      transition: opacity 0.22s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-pill">
    <span id="hudMain">Level 1/100 · 00:00.0 · Tode: 0</span>
    <span class="hud-sub" id="hudBiome">Picknick-Wald · Gefahr 1%</span>
  </div>
  <div class="hud-actions">
    <button class="icon-btn" id="btnRestart" title="Neustart (R)">↻</button>
    <button class="icon-btn" id="btnPause" title="Pause (Esc)">☰</button>
  </div>
</div>

<div id="toast"></div>

<!-- Main Menu -->
<div id="menuOverlay" class="overlay">
  <div class="card">
    <h1>BÄUME HASSEN DICH</h1>
    <p class="sub">100 Level · 10 Biome · Steigende Schwierigkeit</p>
    <div class="editor-grid">
      <div class="field">
        <label for="optHat">Hut</label>
        <select id="optHat">
          <option value="straw">Strohhut</option>
          <option value="cap">Kappe</option>
          <option value="helmet">Bauhelm</option>
          <option value="crown">Krone</option>
          <option value="none">Kein Hut</option>
        </select>
      </div>
      <div class="field">
        <label for="optGlasses">Brille</label>
        <select id="optGlasses">
          <option value="round">Rund</option>
          <option value="square">Eckig</option>
          <option value="shades">Sonnenbrille</option>
        </select>
      </div>
      <div class="field">
        <label for="optShirt">Hemdfarbe</label>
        <select id="optShirt">
          <option value="#d9534f">Rot</option>
          <option value="#3b82f6">Blau</option>
          <option value="#eab308">Gelb</option>
          <option value="#9333ea">Violett</option>
          <option value="#f97316">Orange</option>
        </select>
      </div>
      <div class="field">
        <label for="optHair">Haarfarbe</label>
        <select id="optHair">
          <option value="#4a2e1b">Braun</option>
          <option value="#1f1f1f">Schwarz</option>
          <option value="#d4a74a">Blond</option>
          <option value="#a63c24">Rotbraun</option>
        </select>
      </div>
    </div>

    <div class="level-box">
      <div class="level-row">
        <span id="selectedLevelLabel">Start-Level: 1 / 100</span>
        <small id="selectedBiomeLabel">Picknick-Wald</small>
      </div>
      <div class="level-controls">
        <button class="mini-btn" id="btnLvlMinus">-</button>
        <input type="range" id="levelSlider" min="1" max="1" value="1">
        <button class="mini-btn" id="btnLvlPlus">+</button>
      </div>
    </div>

    <div class="mode-row">
      <button class="mode-btn active" id="modeNormal">Normal (Fortschritt)</button>
      <button class="mode-btn" id="modeChallenge">Challenge (1 Leben)</button>
    </div>
    <button class="btn-primary" id="btnStart">Level starten</button>
    <div class="stats-bar">
      <span id="unlockedLabel">Freigeschaltet: 1/100</span>
      <span id="totalDeathsLabel">Gesamt-Tode: 0</span>
    </div>
  </div>
</div>

<!-- Pause Overlay -->
<div id="pauseOverlay" class="overlay hidden">
  <div class="card">
    <h1>PAUSE</h1>
    <p class="sub" id="pauseSub">Level 1 · Kurze Verschnaufpause.</p>
    <button class="btn-primary" id="btnResume">Weiterspielen</button>
    <button class="btn-sec" id="btnRestartLevel">Level neu starten</button>
    <button class="btn-trap" id="btnCheckTree">Baum prüfen</button>
    <button class="btn-sec" id="btnToMenu">Zum Hauptmenü</button>
  </div>
</div>

<!-- Level Complete Overlay -->
<div id="levelWinOverlay" class="overlay hidden">
  <div class="card">
    <h1 id="winTitle">LEVEL 1 GESCHAFFT</h1>
    <p class="sub" id="winStats">Zeit: 00:00.0 · Tode: 0</p>
    <button class="btn-primary" id="btnNextLevel">Weiter zu Level 2</button>
    <button class="btn-sec" id="btnReplayLevel">Level wiederholen</button>
    <button class="btn-sec" id="btnWinMenu">Zum Hauptmenü</button>
  </div>
</div>

<script>
(() => {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  const MAX_LEVEL = 100;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // UI refs
  const hud = document.getElementById('hud');
  const hudMain = document.getElementById('hudMain');
  const hudBiome = document.getElementById('hudBiome');
  const toastEl = document.getElementById('toast');
  const menuOverlay = document.getElementById('menuOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const pauseSub = document.getElementById('pauseSub');
  const levelWinOverlay = document.getElementById('levelWinOverlay');
  const winTitle = document.getElementById('winTitle');
  const winStats = document.getElementById('winStats');
  const btnNextLevel = document.getElementById('btnNextLevel');

  const optHat = document.getElementById('optHat');
  const optGlasses = document.getElementById('optGlasses');
  const optShirt = document.getElementById('optShirt');
  const optHair = document.getElementById('optHair');
  const modeNormal = document.getElementById('modeNormal');
  const modeChallenge = document.getElementById('modeChallenge');
  const levelSlider = document.getElementById('levelSlider');
  const selectedLevelLabel = document.getElementById('selectedLevelLabel');
  const selectedBiomeLabel = document.getElementById('selectedBiomeLabel');
  const unlockedLabel = document.getElementById('unlockedLabel');
  const totalDeathsLabel = document.getElementById('totalDeathsLabel');

  // 10 Biomes (10 levels each)
  const BIOMES = [
    { name: 'Picknick-Wald',       bg: '#1b3622', path: '#c8ab7c', tree1: '#265c31', tree2: '#1e4d28', ice: false },
    { name: 'Herbst-Hain',         bg: '#332419', path: '#cfa97a', tree1: '#a84a20', tree2: '#c97a26', ice: false },
    { name: 'Nebel-Moor',          bg: '#182b29', path: '#99a892', tree1: '#2d544c', tree2: '#22423c', ice: false },
    { name: 'Kiefern-Schlucht',    bg: '#1d2922', path: '#b89f82', tree1: '#254f3a', tree2: '#1a3b2b', ice: false },
    { name: 'Scharfschützen-Forst',bg: '#1c241b', path: '#bfa67e', tree1: '#355228', tree2: '#273d1d', ice: false },
    { name: 'Apfel-Plantage',      bg: '#23361b', path: '#d1b584', tree1: '#3d6e29', tree2: '#2f571f', ice: false },
    { name: 'Schatten-Dickicht',   bg: '#131722', path: '#8b8e9c', tree1: '#24314a', tree2: '#1a2438', ice: false },
    { name: 'Winter-Taiga',        bg: '#203240', path: '#d7e6f0', tree1: '#3b6b7a', tree2: '#2c5361', ice: true  },
    { name: 'Vulkan-Gehölz',       bg: '#291514', path: '#8f7265', tree1: '#69251e', tree2: '#4d1914', ice: false },
    { name: 'Urwald der Rache',    bg: '#160d1f', path: '#a3899e', tree1: '#3d1c4f', tree2: '#291138', ice: false }
  ];

  function getBiome(lvl) {
    return BIOMES[Math.min(BIOMES.length - 1, Math.floor((lvl - 1) / 10))];
  }

  // Audio Synthesizer
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTone(freq, dur, type = 'sine', vol = 0.12, slide = 0) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }
  function sfxHit() {
    playTone(150, 0.22, 'sawtooth', 0.2, -100);
    setTimeout(() => playTone(980, 0.14, 'triangle', 0.12, 320), 60);
  }
  function sfxClick() { playTone(620, 0.06, 'square', 0.08, -220); }
  function sfxShot() { playTone(260, 0.12, 'sawtooth', 0.18, -190); }
  function sfxBoom() { playTone(95, 0.32, 'sawtooth', 0.24, -65); }
  function sfxWin() {
    [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.18, 'triangle', 0.15), i * 95));
  }

  // Persistent Save
  const STORAGE_KEY = 'bhd_100_save_v2';
  let save = {
    hat: 'straw', glasses: 'round', shirt: '#d9534f', hair: '#4a2e1b',
    mode: 'normal', maxUnlocked: 1, selectedLevel: 1, totalDeaths: 0
  };
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) save = { ...save, ...JSON.parse(raw) };
  } catch (e) {}
  save.maxUnlocked = Math.max(1, Math.min(MAX_LEVEL, save.maxUnlocked || 1));
  save.selectedLevel = Math.max(1, Math.min(save.maxUnlocked, save.selectedLevel || 1));

  function persistSave() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); } catch (e) {}
    syncMenuUI();
  }
  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    const d = Math.floor((sec % 1) * 10);
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${d}`;
  }
  function syncMenuUI() {
    optHat.value = save.hat;
    optGlasses.value = save.glasses;
    optShirt.value = save.shirt;
    optHair.value = save.hair;
    modeNormal.classList.toggle('active', save.mode === 'normal');
    modeChallenge.classList.toggle('active', save.mode === 'challenge');
    levelSlider.max = save.mode === 'challenge' ? 1 : save.maxUnlocked;
    const lvl = save.mode === 'challenge' ? 1 : Math.min(save.selectedLevel, save.maxUnlocked);
    levelSlider.value = lvl;
    selectedLevelLabel.textContent = `Start-Level: ${lvl} / ${MAX_LEVEL}`;
    selectedBiomeLabel.textContent = getBiome(lvl).name + (lvl % 10 === 0 ? ' (Meilenstein)' : '');
    unlockedLabel.textContent = `Freigeschaltet: ${save.maxUnlocked}/${MAX_LEVEL}`;
    totalDeathsLabel.textContent = `Gesamt-Tode: ${save.totalDeaths}`;
  }
  syncMenuUI();

  // Toast
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
  }

  // Deterministic PRNG (Mulberry32)
  function createRng(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Current Level Data
  let currentLevel = 1;
  let currentBiome = BIOMES[0];
  let corridors = [];
  let decoTrees = [];
  let spawnPos = { x: 400, y: 1000 };
  let cabin = { x: 340, y: 100, w: 120, h: 85 };
  let entities = {
    fallTrees: [],
    revolvers: [],
    forkAmbushes: [],
    chasers: [],
    rocks: [],
    rollingLogs: [],
    stairs: [],
    pushLogs: [],
    dirtTraps: [],
    apples: [],
    signs: [],
    axeBaits: []
  };

  function isPointInCorridors(px, py) {
    for (let i = 0; i < corridors.length; i++) {
      const c = corridors[i];
      if (px >= c.x && px <= c.x + c.w && py >= c.y && py <= c.y + c.h) return true;
    }
    return false;
  }

  function isCircleWalkable(cx, cy, r) {
    if (!isPointInCorridors(cx, cy)) return false;
    const d = r * 0.7071;
    const pts = [
      [cx + r, cy], [cx - r, cy], [cx, cy + r], [cx, cy - r],
      [cx + d, cy + d], [cx - d, cy + d], [cx + d, cy - d], [cx - d, cy - d]
    ];
    for (let i = 0; i < pts.length; i++) {
      if (!isPointInCorridors(pts[i][0], pts[i][1])) return false;
    }
    return true;
  }

  // Build any level 1..100 deterministically with escalating difficulty
  function buildLevel(lvl) {
    currentLevel = lvl;
    currentBiome = getBiome(lvl);
    const rng = createRng(lvl * 7919 + 1337);
    const diff = (lvl - 1) / (MAX_LEVEL - 1); // 0.0 -> 1.0
    const isBoss = (lvl % 10 === 0);

    // Difficulty parameters
    const pFallSpeed = 3.8 + diff * 4.7;
    const pAimTime = Math.max(0.30, 0.68 - diff * 0.38);
    const pCooldown = Math.max(0.70, 1.60 - diff * 0.90);
    const pBulletSpd = 320 + diff * 260;
    const pChaserSpd = 115 + diff * 57; // player maxSpeed = 205
    const pLogSpd = 195 + diff * 195;
    const pAppleFuse = Math.max(0.25, 0.52 - diff * 0.27);
    const pHandSlam = Math.max(0.24, 0.48 - diff * 0.24);

    // Number of hazard segments increases with level (2 in L1 -> up to 9 in L100)
    let segCount = Math.min(8, 2 + Math.floor(lvl / 14));
    if (isBoss) segCount += 1;
    if (lvl === 100) segCount = 10;

    // Available segment archetypes unlock progressively in early levels
    const pool = ['fall'];
    if (lvl >= 2) pool.push('revolver');
    if (lvl >= 3) pool.push('fork');
    if (lvl >= 4) pool.push('chaser');
    if (lvl >= 5) pool.push('rolling');
    if (lvl >= 6) pool.push('sniper');
    if (lvl >= 7) pool.push('dirt');
    if (lvl >= 8) pool.push('apples');
    if (lvl >= 9) pool.push('axe');

    corridors = [];
    entities = {
      fallTrees: [], revolvers: [], forkAmbushes: [], chasers: [],
      rocks: [], rollingLogs: [], stairs: [], pushLogs: [],
      dirtTraps: [], apples: [], signs: [], axeBaits: []
    };

    // Build upward from bottom to top, then shift so cabin sits near y = 100
    // Start clearing at top of stack (lowest Y will be cabin, highest Y will be spawn)
    let curY = 260; // Finish area bottom edge

    // Finish Clearing (Cabin)
    corridors.push({ x: 200, y: 70, w: 400, h: 250 });
    cabin = { x: 340, y: 95, w: 120, h: 85 };

    // Add segments going downward (increasing Y)
    for (let s = 0; s < segCount; s++) {
      // Pick archetype: early levels introduce new mechanic explicitly on first segment
      let kind;
      if (lvl <= 9 && s === 0) {
        kind = pool[pool.length - 1];
      } else {
        kind = pool[Math.floor(rng() * pool.length)];
      }

      const segH = 440;
      const topY = curY;
      const botY = curY + segH;
      const midY = (topY + botY) / 2;

      if (kind === 'fork') {
        // Deceptive Fork: both branches walkable, one side hides ambush tree
        const trapRight = rng() > 0.5;
        corridors.push({ x: 150, y: topY - 40, w: 500, h: 110 }); // top rejoin
        corridors.push({ x: 150, y: topY + 20, w: 170, h: segH - 40 }); // left branch
        corridors.push({ x: 480, y: topY + 20, w: 170, h: segH - 40 }); // right branch
        corridors.push({ x: 150, y: botY - 80, w: 500, h: 120 }); // bottom split
        entities.forkAmbushes.push({
          x: trapRight ? 565 : 235, y: midY, triggered: false, active: false, r: 0, maxR: 78 + diff * 18
        });
        entities.signs.push({
          x: 400, y: botY - 35,
          text: trapRight ? 'RECHTS = SICHER' : 'LINKS = SICHER'
        });
      } else if (kind === 'rolling') {
        // Narrow stair corridor + guaranteed left/right safe alcove
        const alcoveLeft = rng() > 0.5;
        corridors.push({ x: 295, y: topY - 40, w: 210, h: segH + 80 });
        corridors.push({
          x: alcoveLeft ? 165 : 465, y: midY - 75, w: 170, h: 150
        });
        entities.stairs.push({ x: 308, y: topY + 10, w: 184, h: segH - 20 });
        entities.rollingLogs.push({
          x: 400, y: topY + 15, topY: topY + 15, botY: botY - 10,
          w: 176, h: 30, speed: pLogSpd, active: false, cooldown: 0.4 + rng() * 0.4
        });
      } else {
        // Standard generous corridor (width 280..340, always >= 50px vertical overlap)
        const w = kind === 'fall' ? 250 : 320;
        const cx = 400 - w / 2;
        corridors.push({ x: cx, y: topY - 40, w: w, h: segH + 80 });

        if (kind === 'fall') {
          const count = lvl >= 35 ? 2 : 1;
          for (let k = 0; k < count; k++) {
            const fromRight = (k % 2 === 0) ? (rng() > 0.4) : !true;
            const fy = count === 1 ? midY : (topY + 130 + k * 190);
            entities.fallTrees.push({
              x: fromRight ? (cx + w - 12) : (cx + 12),
              y: fy, dir: fromRight ? -1 : 1,
              triggered: false, falling: false, fallen: false,
              angle: 0, speed: 0, accel: pFallSpeed, reach: 145
            });
          }
        } else if (kind === 'revolver') {
          const count = 1 + (lvl >= 15 ? 1 : 0) + (lvl >= 60 ? 1 : 0);
          for (let k = 0; k < count; k++) {
            const leftSide = (k % 2 === 0);
            entities.revolvers.push({
              x: leftSide ? cx + 18 : cx + w - 18,
              y: topY + 95 + k * (260 / Math.max(1, count)),
              state: 'idle', timer: 0, aimX: 400, aimY: midY,
              cooldown: 0.35 + k * 0.45, baseCooldown: pCooldown,
              aimTime: pAimTime, bulletSpd: pBulletSpd
            });
          }
        } else if (kind === 'chaser') {
          // Two rocks with guaranteed 90px gap in center (x: 355..445)
          const rockY = topY + 135;
          entities.rocks.push({ x: 308, y: rockY, r: 47 });
          entities.rocks.push({ x: 492, y: rockY, r: 47 });
          entities.chasers.push({
            x: 400, y: botY - 90, active: false, stuck: false,
            speed: pChaserSpd, r: 22, triggerY: botY + 35, topLimitY: rockY - 45
          });
        } else if (kind === 'sniper') {
          // Sniper at top + pushable cover log below
          entities.pushLogs.push({
            x: 355, y: botY - 120, w: 90, h: 28,
            minX: cx + 20, maxX: cx + w - 110, minY: topY + 115, maxY: botY - 70
          });
          entities.revolvers.push({
            x: 400, y: topY + 42,
            state: 'idle', timer: 0, aimX: 400, aimY: midY,
            cooldown: 0.45, baseCooldown: pCooldown * 0.9,
            aimTime: pAimTime, bulletSpd: pBulletSpd * 1.05
          });
        } else if (kind === 'dirt') {
          // 1 to 3 suspicious dirt patches offset so a clear path always exists
          const count = 1 + (lvl >= 25 ? 1 : 0) + (lvl >= 65 ? 1 : 0);
          for (let k = 0; k < count; k++) {
            const dx = k === 0 ? 400 : (k === 1 ? 315 : 485);
            const dy = topY + 110 + k * 115;
            entities.dirtTraps.push({ x: dx, y: dy, r: 38, triggered: false });
          }
        } else if (kind === 'apples') {
          const count = 3 + Math.min(5, Math.floor(lvl / 18));
          entities.signs.push({ x: 400, y: botY - 40, text: 'ÄPFEL = GRATIS' });
          for (let k = 0; k < count; k++) {
            const ax = cx + 52 + rng() * (w - 104);
            const ay = topY + 65 + (k / count) * (segH - 140);
            entities.apples.push({
              x: ax, y: ay, r: 15, armed: false, exploded: false,
              fuse: 0, maxFuse: pAppleFuse, blastR: 66 + diff * 14
            });
          }
        } else if (kind === 'axe') {
          entities.axeBaits.push({
            x: 400, y: midY, triggered: false, handActive: false,
            slamT: 0, maxSlam: pHandSlam, blastR: 64 + diff * 14
          });
          // Extra flanking revolver in high levels
          if (lvl >= 45) {
            entities.revolvers.push({
              x: cx + 18, y: topY + 100,
              state: 'idle', timer: 0, aimX: 400, aimY: midY,
              cooldown: 0.6, baseCooldown: pCooldown,
              aimTime: pAimTime, bulletSpd: pBulletSpd
            });
          }
        }
      }

      // Secondary bonus hazard in higher levels (Level >= 20) for layered challenge
      if (lvl >= 20 && kind !== 'fork' && kind !== 'rolling' && rng() < 0.35 + diff * 0.45) {
        entities.apples.push({
          x: 310 + rng() * 180, y: midY + (rng() - 0.5) * 140,
          r: 15, armed: false, exploded: false, fuse: 0, maxFuse: pAppleFuse, blastR: 62
        });
      }

      curY = botY;
    }

    // Start Clearing (Picnic Area)
    corridors.push({ x: 220, y: curY - 40, w: 360, h: 300 });
    spawnPos = { x: 400, y: curY + 135 };

    // Build Decorative Forest strictly outside corridors
    decoTrees = [];
    const maxY = curY + 340;
    for (let y = 20; y <= maxY; y += 58) {
      for (let x = 15; x <= 785; x += 64) {
        const jx = x + (rng() - 0.5) * 30;
        const jy = y + (rng() - 0.5) * 26;
        if (!isCircleWalkable(jx, jy, 44) && !isPointInCorridors(jx, jy)) {
          decoTrees.push({
            x: jx, y: jy,
            scale: 0.85 + rng() * 0.35,
            hue: rng() > 0.5 ? currentBiome.tree1 : currentBiome.tree2
          });
        }
      }
    }
  }

  // Runtime State
  let state = 'menu'; // menu, playing, dead, paused, levelwin
  let levelTime = 0;
  let levelDeaths = 0;
  let deathTimer = 0;
  let camera = { x: 400, y: 1000, shake: 0 };
  let bullets = [];
  let particles = [];

  const player = {
    x: 400, y: 1000, vx: 0, vy: 0, r: 13,
    walkCycle: 0, alive: true, ragdollRot: 0, ragdollSpin: 0, glasses: null
  };

  function startLevel(lvl, resetTimer = true) {
    initAudio();
    buildLevel(lvl);
    bullets = [];
    particles = [];
    player.x = spawnPos.x;
    player.y = spawnPos.y;
    player.vx = 0;
    player.vy = 0;
    player.alive = true;
    player.ragdollRot = 0;
    player.ragdollSpin = 0;
    player.glasses = null;
    if (resetTimer) {
      levelTime = 0;
      levelDeaths = 0;
    }
    camera.x = player.x;
    camera.y = player.y - 60;
    camera.shake = 0;
    state = 'playing';
    menuOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    levelWinOverlay.classList.add('hidden');
    hud.classList.remove('hidden');
    showToast(`Level ${lvl}/100 · ${currentBiome.name}${lvl % 10 === 0 ? ' (Meilenstein)' : ''}`);
  }

  function killPlayer(reason, knockX = 0, knockY = 1) {
    if (!player.alive || state !== 'playing') return;
    player.alive = false;
    state = 'dead';
    deathTimer = 1.15;
    levelDeaths++;
    save.totalDeaths++;
    persistSave();
    sfxHit();
    camera.shake = 12;

    const len = Math.hypot(knockX, knockY) || 1;
    player.vx = (knockX / len) * 280;
    player.vy = (knockY / len) * 280;
    player.ragdollSpin = (Math.random() > 0.5 ? 1 : -1) * 11;
    player.glasses = {
      x: player.x, y: player.y - 14,
      vx: (Math.random() - 0.5) * 180 - (knockX / len) * 90,
      vy: -160 - Math.random() * 80,
      rot: 0, spin: (Math.random() - 0.5) * 16
    };
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 140;
      particles.push({
        x: player.x, y: player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.45 + Math.random() * 0.35, color: i % 2 ? '#f6e27f' : '#e05a47', size: 4
      });
    }
    showToast(reason);
  }

  // Input Handling
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && (state === 'playing' || state === 'dead')) {
      startLevel(save.mode === 'challenge' ? 1 : currentLevel, false);
    }
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (state === 'playing') openPause();
      else if (state === 'paused') closePause();
    }
    if ((e.code === 'Enter' || e.code === 'Space') && state === 'levelwin') {
      if (currentLevel < MAX_LEVEL) startLevel(currentLevel + 1, true);
      else startLevel(1, true);
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  const joy = { active: false, id: null, ox: 0, oy: 0, cx: 0, cy: 0, dx: 0, dy: 0, maxR: 54 };
  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'playing') return;
    initAudio();
    if (!joy.active) {
      joy.active = true; joy.id = e.pointerId;
      joy.ox = e.clientX; joy.oy = e.clientY;
      joy.cx = e.clientX; joy.cy = e.clientY;
      joy.dx = 0; joy.dy = 0;
      canvas.setPointerCapture(e.pointerId);
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!joy.active || e.pointerId !== joy.id) return;
    const rx = e.clientX - joy.ox;
    const ry = e.clientY - joy.oy;
    const dist = Math.hypot(rx, ry);
    const clamped = Math.min(dist, joy.maxR);
    const ang = Math.atan2(ry, rx);
    joy.cx = joy.ox + Math.cos(ang) * clamped;
    joy.cy = joy.oy + Math.sin(ang) * clamped;
    if (dist > 6) {
      joy.dx = (Math.cos(ang) * clamped) / joy.maxR;
      joy.dy = (Math.sin(ang) * clamped) / joy.maxR;
    } else {
      joy.dx = 0; joy.dy = 0;
    }
  });
  function releaseJoy(e) {
    if (joy.active && e.pointerId === joy.id) {
      joy.active = false; joy.id = null; joy.dx = 0; joy.dy = 0;
    }
  }
  canvas.addEventListener('pointerup', releaseJoy);
  canvas.addEventListener('pointercancel', releaseJoy);

  // Menu Controls
  optHat.onchange = () => { save.hat = optHat.value; persistSave(); };
  optGlasses.onchange = () => { save.glasses = optGlasses.value; persistSave(); };
  optShirt.onchange = () => { save.shirt = optShirt.value; persistSave(); };
  optHair.onchange = () => { save.hair = optHair.value; persistSave(); };
  modeNormal.onclick = () => { save.mode = 'normal'; persistSave(); };
  modeChallenge.onclick = () => { save.mode = 'challenge'; persistSave(); };
  levelSlider.oninput = () => { save.selectedLevel = parseInt(levelSlider.value, 10); persistSave(); };
  document.getElementById('btnLvlMinus').onclick = () => {
    save.selectedLevel = Math.max(1, save.selectedLevel - 1); persistSave();
  };
  document.getElementById('btnLvlPlus').onclick = () => {
    save.selectedLevel = Math.min(save.maxUnlocked, save.selectedLevel + 1); persistSave();
  };

  document.getElementById('btnStart').onclick = () => {
    const startLvl = save.mode === 'challenge' ? 1 : save.selectedLevel;
    startLevel(startLvl, true);
  };
  document.getElementById('btnRestart').onclick = () => {
    if (state === 'playing' || state === 'dead') {
      startLevel(save.mode === 'challenge' ? 1 : currentLevel, false);
    }
  };
  function openPause() {
    state = 'paused';
    pauseSub.textContent = `Level ${currentLevel}/100 · ${currentBiome.name}`;
    pauseOverlay.classList.remove('hidden');
  }
  function closePause() {
    pauseOverlay.classList.add('hidden');
    state = 'playing';
  }
  document.getElementById('btnPause').onclick = () => { if (state === 'playing') openPause(); };
  document.getElementById('btnResume').onclick = closePause;
  document.getElementById('btnRestartLevel').onclick = () => {
    closePause();
    startLevel(save.mode === 'challenge' ? 1 : currentLevel, false);
  };
  document.getElementById('btnCheckTree').onclick = () => {
    closePause();
    killPlayer('Selbst im Pause-Menü hasst dich ein Baum!', 0, 1);
  };
  document.getElementById('btnToMenu').onclick = () => {
    state = 'menu'; pauseOverlay.classList.add('hidden'); hud.classList.add('hidden'); menuOverlay.classList.remove('hidden');
    syncMenuUI();
  };
  btnNextLevel.onclick = () => {
    if (currentLevel < MAX_LEVEL) startLevel(currentLevel + 1, true);
    else startLevel(1, true);
  };
  document.getElementById('btnReplayLevel').onclick = () => startLevel(currentLevel, true);
  document.getElementById('btnWinMenu').onclick = () => {
    state = 'menu'; levelWinOverlay.classList.add('hidden'); hud.classList.add('hidden'); menuOverlay.classList.remove('hidden');
    syncMenuUI();
  };

  // Collision Helpers
  function resolveCircleObstacle(px, py, pr, ox, oy, or) {
    const dx = px - ox; const dy = py - oy;
    const dist = Math.hypot(dx, dy);
    const minD = pr + or;
    if (dist < minD && dist > 0.0001) {
      const push = minD - dist;
      return { x: px + (dx / dist) * push, y: py + (dy / dist) * push };
    }
    return { x: px, y: py };
  }
  function circleRectHit(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX; const dy = cy - closestY;
    return (dx * dx + dy * dy) < (r * r);
  }

  // Update Loop
  function update(dt) {
    if (camera.shake > 0) camera.shake = Math.max(0, camera.shake - dt * 32);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state === 'dead') {
      player.x += player.vx * dt; player.y += player.vy * dt;
      player.vx *= Math.pow(0.05, dt); player.vy *= Math.pow(0.05, dt);
      player.ragdollRot += player.ragdollSpin * dt;
      if (player.glasses) {
        player.glasses.x += player.glasses.vx * dt;
        player.glasses.y += player.glasses.vy * dt;
        player.glasses.vy += 420 * dt;
        player.glasses.rot += player.glasses.spin * dt;
      }
      deathTimer -= dt;
      if (deathTimer <= 0) {
        const nextLvl = save.mode === 'challenge' ? 1 : currentLevel;
        startLevel(nextLvl, save.mode === 'challenge');
      }
      return;
    }

    if (state !== 'playing') return;

    levelTime += dt;

    // Input
    let ix = joy.active ? joy.dx : 0;
    let iy = joy.active ? joy.dy : 0;
    if (keys['ArrowLeft'] || keys['KeyA']) ix -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
    if (keys['ArrowUp'] || keys['KeyW']) iy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) iy += 1;
    const ilen = Math.hypot(ix, iy);
    if (ilen > 1) { ix /= ilen; iy /= ilen; }

    const maxSpeed = 205;
    const accel = currentBiome.ice ? 4.8 : 11.5;
    player.vx += (ix * maxSpeed - player.vx) * Math.min(1, accel * dt);
    player.vy += (iy * maxSpeed - player.vy) * Math.min(1, accel * dt);

    if (Math.hypot(player.vx, player.vy) > 12) player.walkCycle += dt * 11;

    // Slide movement against union corridor walls
    const nx = player.x + player.vx * dt;
    const ny = player.y + player.vy * dt;
    if (isCircleWalkable(nx, player.y, player.r)) player.x = nx; else player.vx = 0;
    if (isCircleWalkable(player.x, ny, player.r)) player.y = ny; else player.vy = 0;

    // 1. Falling Trees
    for (const ft of entities.fallTrees) {
      if (!ft.triggered && Math.abs(player.y - ft.y) < 95) {
        ft.triggered = true; ft.falling = true; sfxClick();
      }
      if (ft.falling) {
        ft.speed += ft.accel * dt;
        ft.angle += ft.speed * dt;
        if (ft.angle >= Math.PI / 2) {
          ft.angle = Math.PI / 2; ft.falling = false; ft.fallen = true;
          camera.shake = 6; sfxBoom();
        } else if (ft.angle > 0.72) {
          const minX = ft.dir < 0 ? ft.x - ft.reach : ft.x;
          const maxX = ft.dir < 0 ? ft.x : ft.x + ft.reach;
          if (player.x > minX && player.x < maxX && Math.abs(player.y - ft.y) < 32) {
            killPlayer('Vom Fall-Baum erschlagen!', ft.dir, 0.3);
          }
        }
      }
    }

    // 2. Revolver & Sniper Trees
    for (const rv of entities.revolvers) {
      if (Math.abs(player.y - rv.y) < 330) {
        rv.cooldown -= dt;
        if (rv.state === 'idle' && rv.cooldown <= 0) {
          rv.state = 'aim'; rv.timer = rv.aimTime;
          rv.aimX = player.x; rv.aimY = player.y;
          sfxClick();
        } else if (rv.state === 'aim') {
          rv.timer -= dt;
          if (rv.timer <= 0) {
            const ang = Math.atan2(rv.aimY - rv.y, rv.aimX - rv.x);
            bullets.push({
              x: rv.x, y: rv.y,
              vx: Math.cos(ang) * rv.bulletSpd, vy: Math.sin(ang) * rv.bulletSpd,
              r: 6, life: 2.0
            });
            sfxShot();
            rv.state = 'idle'; rv.cooldown = rv.baseCooldown;
          }
        }
      }
    }

    // 3. Fork Ambushes
    for (const fa of entities.forkAmbushes) {
      if (!fa.triggered && Math.hypot(player.x - fa.x, player.y - fa.y) < 105) {
        fa.triggered = true; fa.active = true; sfxBoom();
      }
      if (fa.active) {
        fa.r = Math.min(fa.maxR, fa.r + 390 * dt);
        if (Math.hypot(player.x - fa.x, player.y - fa.y) < fa.r + player.r - 8) {
          killPlayer('Falle in der Weggabelung!', 0, 1);
        }
      }
    }

    // 4. Rocks & Chaser Trees
    for (const rk of entities.rocks) {
      const res = resolveCircleObstacle(player.x, player.y, player.r, rk.x, rk.y, rk.r);
      if (isCircleWalkable(res.x, res.y, player.r)) {
        player.x = res.x; player.y = res.y;
      }
    }
    for (const ch of entities.chasers) {
      if (!ch.active && player.y < ch.triggerY && player.y > ch.topLimitY) {
        ch.active = true;
      }
      if (ch.active && !ch.stuck) {
        const dx = player.x - ch.x; const dy = player.y - ch.y;
        const d = Math.hypot(dx, dy) || 1;
        const cx = ch.x + (dx / d) * ch.speed * dt;
        const cy = ch.y + (dy / d) * ch.speed * dt;
        let blocked = false;
        for (const rk of entities.rocks) {
          if (Math.hypot(cx - rk.x, cy - rk.y) < rk.r + 36) blocked = true;
        }
        if (!blocked) { ch.x = cx; ch.y = cy; }
        else if (player.y < ch.topLimitY) { ch.stuck = true; }
        if (Math.hypot(player.x - ch.x, player.y - ch.y) < ch.r + player.r) {
          killPlayer('Vom Verfolger-Baum geschnappt!', dx, dy);
        }
      }
    }

    // 5. Rolling Logs
    for (const rl of entities.rollingLogs) {
      if (player.y < rl.botY + 80 && player.y > rl.topY - 60) {
        if (!rl.active) {
          rl.cooldown -= dt;
          if (rl.cooldown <= 0) { rl.active = true; rl.y = rl.topY; sfxClick(); }
        } else {
          rl.y += rl.speed * dt;
          if (circleRectHit(player.x, player.y, player.r, rl.x - rl.w / 2, rl.y - rl.h / 2, rl.w, rl.h)) {
            killPlayer('Vom Baumstamm überrollt!', 0, 1);
          }
          if (rl.y > rl.botY) { rl.active = false; rl.cooldown = Math.max(0.45, 1.0 - (currentLevel / 180)); }
        }
      }
    }

    // 6. Pushable Cover Logs
    for (const pl of entities.pushLogs) {
      if (circleRectHit(player.x, player.y, player.r, pl.x, pl.y, pl.w, pl.h)) {
        const pushY = player.y > pl.y + pl.h / 2 ? -1 : 1;
        const pushX = player.x < pl.x + pl.w / 2 ? 1 : -1;
        if (Math.abs(player.y - (pl.y + pl.h / 2)) > pl.h / 2 - 4) {
          pl.y = Math.max(pl.minY, Math.min(pl.maxY, pl.y + pushY * 150 * dt));
        } else {
          pl.x = Math.max(pl.minX, Math.min(pl.maxX, pl.x + pushX * 150 * dt));
        }
        if (player.y > pl.y + pl.h / 2) player.y = Math.max(player.y, pl.y + pl.h + player.r);
      }
    }

    // 7. Suspicious Dirt Traps
    for (const dtTrap of entities.dirtTraps) {
      if (!dtTrap.triggered && Math.hypot(player.x - dtTrap.x, player.y - dtTrap.y) < dtTrap.r + player.r - 5) {
        dtTrap.triggered = true; sfxBoom();
        killPlayer('Sprungbaum aus dem Erdfleck!', 0, 1);
      }
    }

    // 8. Exploding Apples
    for (const ap of entities.apples) {
      if (ap.exploded) continue;
      if (!ap.armed && Math.hypot(player.x - ap.x, player.y - ap.y) < ap.blastR - 2) {
        ap.armed = true; ap.fuse = ap.maxFuse; sfxClick();
      }
      if (ap.armed) {
        ap.fuse -= dt;
        if (ap.fuse <= 0) {
          ap.exploded = true; sfxBoom(); camera.shake = 8;
          for (let k = 0; k < 14; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
              x: ap.x, y: ap.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150,
              life: 0.42, color: k % 2 ? '#ff4d4d' : '#ffbe3b', size: 6
            });
          }
          if (Math.hypot(player.x - ap.x, player.y - ap.y) < ap.blastR) {
            killPlayer('Explodierender Apfel!', player.x - ap.x, player.y - ap.y);
          }
        }
      }
    }

    // 9. Axe Baits
    for (const ab of entities.axeBaits) {
      if (!ab.triggered && Math.hypot(player.x - ab.x, player.y - ab.y) < 50) {
        ab.triggered = true; ab.handActive = true; ab.slamT = ab.maxSlam; sfxClick();
      }
      if (ab.handActive) {
        ab.slamT -= dt;
        if (ab.slamT <= 0) {
          ab.handActive = false; camera.shake = 10; sfxBoom();
          if (Math.hypot(player.x - ab.x, player.y - ab.y) < ab.blastR) {
            killPlayer('Vom Hand-Baum zerquetscht!', 0, 1);
          }
        }
      }
    }

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let blocked = false;
      for (const pl of entities.pushLogs) {
        if (circleRectHit(b.x, b.y, b.r, pl.x, pl.y, pl.w, pl.h)) { blocked = true; break; }
      }
      if (blocked) { bullets.splice(i, 1); continue; }
      if (Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.r) {
        bullets.splice(i, 1);
        killPlayer('Vom Revolver-Baum getroffen!', b.vx, b.vy);
        continue;
      }
      if (b.life <= 0) bullets.splice(i, 1);
    }

    // Cabin Finish Check
    if (circleRectHit(player.x, player.y, player.r, cabin.x, cabin.y + 35, cabin.w, cabin.h - 15)) {
      state = 'levelwin';
      sfxWin();
      if (currentLevel < MAX_LEVEL && currentLevel + 1 > save.maxUnlocked) {
        save.maxUnlocked = currentLevel + 1;
      }
      save.selectedLevel = Math.min(MAX_LEVEL, currentLevel + 1);
      persistSave();
      hud.classList.add('hidden');
      if (currentLevel >= MAX_LEVEL) {
        winTitle.textContent = 'ALLE 100 LEVEL GESCHAFFT!';
        btnNextLevel.textContent = 'Von Level 1 neu starten';
      } else {
        winTitle.textContent = `LEVEL ${currentLevel} GESCHAFFT`;
        btnNextLevel.textContent = `Weiter zu Level ${currentLevel + 1}`;
      }
      winStats.textContent = `${currentBiome.name} · Zeit: ${formatTime(levelTime)} · Tode: ${levelDeaths}`;
      levelWinOverlay.classList.remove('hidden');
    }

    // Camera follow
    camera.x += (player.x - camera.x) * Math.min(1, 7.5 * dt);
    camera.y += ((player.y - 55) - camera.y) * Math.min(1, 7.5 * dt);

    hudMain.textContent = `Level ${currentLevel}/${MAX_LEVEL} · ${formatTime(levelTime)} · Tode: ${levelDeaths}`;
    hudBiome.textContent = `${currentBiome.name} · Gefahr ${currentLevel}%`;
  }

  // Drawing Helpers
  function drawTree(x, y, scale = 1, angry = false, canopyColor = '#2b7038', angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(0, 6, 28, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.rotate(angle);
    ctx.fillStyle = '#6b4423'; ctx.strokeStyle = '#2d1a0a'; ctx.lineWidth = 3;
    ctx.fillRect(-10, -34, 20, 40); ctx.strokeRect(-10, -34, 20, 40);
    ctx.fillStyle = canopyColor; ctx.strokeStyle = '#14331a'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, -56, 32, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (angry) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-10, -54, 5, 0, Math.PI * 2); ctx.arc(10, -54, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-9, -54, 2.5, 0, Math.PI * 2); ctx.arc(9, -54, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#14331a'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-17, -63); ctx.lineTo(-4, -58);
      ctx.moveTo(17, -63); ctx.lineTo(4, -58);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGlassesShape(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.8;
    ctx.fillStyle = save.glasses === 'shades' ? '#111' : 'rgba(210,240,255,0.65)';
    if (save.glasses === 'round') {
      ctx.beginPath(); ctx.arc(-4, 0, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(4, 0, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillRect(-7.5, -2.5, 6, 5); ctx.strokeRect(-7.5, -2.5, 6, 5);
      ctx.fillRect(1.5, -2.5, 6, 5); ctx.strokeRect(1.5, -2.5, 6, 5);
    }
    ctx.restore();
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0, 8, 13, 6, 0, 0, Math.PI * 2); ctx.fill();
    if (!player.alive) ctx.rotate(player.ragdollRot);
    const bob = player.alive ? Math.sin(player.walkCycle) * 2.5 : 0;

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(-7, -2 + bob * 0.5, 5, 11);
    ctx.fillRect(2, -2 - bob * 0.5, 5, 11);

    ctx.fillStyle = save.shirt; ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-10, -18 + bob * 0.3, 20, 18, 5); ctx.fill(); ctx.stroke();

    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath(); ctx.arc(0, -25 + bob * 0.3, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    ctx.fillStyle = save.hair;
    ctx.beginPath(); ctx.arc(0, -28 + bob * 0.3, 9.5, Math.PI, Math.PI * 2); ctx.fill();

    if (player.alive) drawGlassesShape(0, -25 + bob * 0.3);

    const hy = -33 + bob * 0.3;
    if (save.hat === 'straw') {
      ctx.fillStyle = '#e5c158';
      ctx.beginPath(); ctx.ellipse(0, hy + 2, 16, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, hy + 1, 8, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (save.hat === 'cap') {
      ctx.fillStyle = '#2563eb';
      ctx.beginPath(); ctx.arc(0, hy + 2, 9.5, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillRect(0, hy, 12, 3);
    } else if (save.hat === 'helmet') {
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.arc(0, hy + 3, 11, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else if (save.hat === 'crown') {
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(-8, hy + 2); ctx.lineTo(-8, hy - 7); ctx.lineTo(-3, hy - 2);
      ctx.lineTo(0, hy - 9); ctx.lineTo(3, hy - 2); ctx.lineTo(8, hy - 7); ctx.lineTo(8, hy + 2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.restore();

    if (player.glasses) {
      ctx.save();
      ctx.translate(player.glasses.x, player.glasses.y);
      ctx.rotate(player.glasses.rot);
      drawGlassesShape(0, 0);
      ctx.restore();
    }
  }

  function render() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth; const h = canvas.clientHeight;
    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
      canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = currentBiome.bg;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    const sx = (Math.random() - 0.5) * camera.shake;
    const sy = (Math.random() - 0.5) * camera.shake;
    ctx.translate(w / 2 - camera.x + sx, h / 2 - camera.y + sy);

    // Paths
    ctx.fillStyle = currentBiome.path;
    for (const c of corridors) {
      ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 18); ctx.fill();
    }

    // Start Picnic Blanket
    ctx.fillStyle = '#d94848';
    ctx.fillRect(spawnPos.x - 55, spawnPos.y + 30, 110, 68);
    ctx.fillStyle = '#f8f5ec';
    for (let px = spawnPos.x - 55; px < spawnPos.x + 55; px += 22) {
      for (let py = spawnPos.y + 30; py < spawnPos.y + 98; py += 22) {
        if (((Math.round(px) + Math.round(py)) / 22) % 2 === 0) ctx.fillRect(px, py, 11, 11);
      }
    }

    // Stairs
    ctx.fillStyle = '#8b6340';
    for (const st of entities.stairs) {
      for (let sy2 = st.y; sy2 < st.y + st.h; sy2 += 26) ctx.fillRect(st.x, sy2, st.w, 15);
    }

    // Dirt Traps
    for (const dtTrap of entities.dirtTraps) {
      ctx.fillStyle = '#6e4c2e';
      ctx.beginPath(); ctx.ellipse(dtTrap.x, dtTrap.y, dtTrap.r, dtTrap.r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#472f1a'; ctx.lineWidth = 3; ctx.stroke();
    }

    // Signs
    for (const sg of entities.signs) {
      ctx.fillStyle = '#7c522c'; ctx.fillRect(sg.x - 4, sg.y, 8, 28);
      ctx.fillStyle = '#e5cfa3'; ctx.fillRect(sg.x - 56, sg.y - 14, 112, 22);
      ctx.fillStyle = '#222'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(sg.text, sg.x, sg.y + 1);
    }

    // Axe Baits
    for (const ab of entities.axeBaits) {
      ctx.save(); ctx.translate(ab.x, ab.y);
      ctx.fillStyle = '#8d5524'; ctx.fillRect(-3, -16, 6, 32);
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath(); ctx.moveTo(3, -16); ctx.lineTo(16, -20); ctx.lineTo(16, -4); ctx.lineTo(3, -8); ctx.fill();
      if (ab.handActive) {
        ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, ab.blastR * (1 - ab.slamT / ab.maxSlam), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    // Revolver Aim Lines
    for (const rv of entities.revolvers) {
      if (rv.state === 'aim') {
        ctx.strokeStyle = 'rgba(255, 60, 60, 0.8)'; ctx.lineWidth = 2.5;
        ctx.setLineDash([8, 6]);
        ctx.beginPath(); ctx.moveTo(rv.x, rv.y - 30); ctx.lineTo(rv.aimX, rv.aimY); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Y-Sorted Entities
    const drawables = [];
    for (const t of decoTrees) {
      if (Math.abs(t.y - camera.y) < h * 0.85) {
        drawables.push({ y: t.y, fn: () => drawTree(t.x, t.y, t.scale, false, t.hue) });
      }
    }
    for (const ft of entities.fallTrees) {
      drawables.push({ y: ft.y, fn: () => drawTree(ft.x, ft.y, 1.15, true, '#2f7a3e', ft.dir * ft.angle) });
    }
    for (const rv of entities.revolvers) {
      drawables.push({ y: rv.y, fn: () => drawTree(rv.x, rv.y, 1.05, true, '#3a6b2c') });
    }
    for (const fa of entities.forkAmbushes) {
      if (fa.active) {
        drawables.push({
          y: fa.y,
          fn: () => {
            ctx.fillStyle = 'rgba(220,60,40,0.35)';
            ctx.beginPath(); ctx.arc(fa.x, fa.y, fa.r, 0, Math.PI * 2); ctx.fill();
            drawTree(fa.x, fa.y, 1.25, true, '#8c2d23');
          }
        });
      }
    }
    for (const rk of entities.rocks) {
      drawables.push({
        y: rk.y + 10,
        fn: () => {
          ctx.fillStyle = '#6c757d'; ctx.strokeStyle = '#343a40'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(rk.x, rk.y, rk.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
      });
    }
    for (const ch of entities.chasers) {
      drawables.push({ y: ch.y, fn: () => drawTree(ch.x, ch.y, 1.12, true, '#5c2d1f') });
    }
    for (const rl of entities.rollingLogs) {
      if (rl.active) {
        drawables.push({
          y: rl.y,
          fn: () => {
            ctx.fillStyle = '#6b4423'; ctx.strokeStyle = '#2d1a0a'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.roundRect(rl.x - rl.w / 2, rl.y - rl.h / 2, rl.w, rl.h, 12);
            ctx.fill(); ctx.stroke();
          }
        });
      }
    }
    for (const pl of entities.pushLogs) {
      drawables.push({
        y: pl.y + pl.h / 2,
        fn: () => {
          ctx.fillStyle = '#7f5539'; ctx.strokeStyle = '#2d1a0a'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, pl.h, 8); ctx.fill(); ctx.stroke();
        }
      });
    }
    for (const ap of entities.apples) {
      if (ap.exploded) continue;
      drawables.push({
        y: ap.y,
        fn: () => {
          ctx.fillStyle = ap.armed && Math.floor(ap.fuse * 20) % 2 ? '#fff' : '#d62828';
          ctx.strokeStyle = '#4a0c0c'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(ap.x, ap.y, ap.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#38b000'; ctx.fillRect(ap.x - 2, ap.y - ap.r - 5, 4, 6);
        }
      });
    }
    // Finish Cabin (gold roof on Level 100)
    drawables.push({
      y: cabin.y + cabin.h,
      fn: () => {
        ctx.fillStyle = '#8b5a2b'; ctx.strokeStyle = '#2b180a'; ctx.lineWidth = 4;
        ctx.fillRect(cabin.x, cabin.y + 25, cabin.w, cabin.h - 25);
        ctx.strokeRect(cabin.x, cabin.y + 25, cabin.w, cabin.h - 25);
        ctx.fillStyle = currentLevel === MAX_LEVEL ? '#eab308' : '#a63429';
        ctx.beginPath();
        ctx.moveTo(cabin.x - 14, cabin.y + 28);
        ctx.lineTo(cabin.x + cabin.w / 2, cabin.y - 24);
        ctx.lineTo(cabin.x + cabin.w + 14, cabin.y + 28);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f6e27f';
        ctx.fillRect(cabin.x + cabin.w / 2 - 16, cabin.y + cabin.h - 38, 32, 38);
        ctx.strokeRect(cabin.x + cabin.w / 2 - 16, cabin.y + cabin.h - 38, 32, 38);
      }
    });

    drawables.push({ y: player.y, fn: drawPlayer });
    drawables.sort((a, b) => a.y - b.y);
    for (const d of drawables) d.fn();

    // Bullets
    ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    for (const b of bullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // Particles
    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.restore();

    // Virtual Joystick
    if (joy.active && state === 'playing') {
      ctx.save();
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, joy.maxR, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(joy.cx, joy.cy, 22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(246,226,127,0.72)'; ctx.fill();
      ctx.restore();
    }
  }

  buildLevel(1);
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
